repos:
  # Pinned to the exact ruff in pyproject's dev group. When these drift, the
  # two versions disagree on formatting: `uv run ruff format` reports clean and
  # then the hook reformats the same file, aborting every commit. Bump both
  # together or not at all.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: debug-statements

  # Zero real credentials in git history — the plan is explicit that they will
  # check. .gitleaks.toml lists the sanctioned dev placeholders and says why
  # each one is safe; inline `gitleaks:allow` comments are not honoured by this
  # version, and a config file is more auditable anyway.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
