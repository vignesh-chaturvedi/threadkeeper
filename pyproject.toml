[project]
name = "threadkeeper"
version = "0.1.0"
description = "A durable, resumable conversational sales agent for an Indian lending funnel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "redis>=5.2",
    "structlog>=24.4",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff — one tool for lint + format. Runs on every commit via pre-commit.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "ASYNC", # flake8-async — matters a lot in this codebase
    "S",   # bandit
    "BLE", # blind except — allowed only where a noqa says why
    "C4",  # comprehensions
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"migrations/*" = ["E501", "I001"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs postgres + redis running (docker compose up -d db redis)",
]
